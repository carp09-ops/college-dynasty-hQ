name: Install Saturday Foundry assets

on:
  push:
    branches:
      - saturday-foundry-test

permissions:
  contents: write

jobs:
  install-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: saturday-foundry-test
          fetch-depth: 0

      - name: Install exact Saturday Foundry asset set
        shell: bash
        run: |
          set -euo pipefail
          test -f saturday-foundry-assets-install.zip
          rm -rf assets
          unzip -q saturday-foundry-assets-install.zip
          test -f assets/saturday-foundry-lockup.webp
          test -f assets/saturday-foundry-shield.webp
          test -f assets/saturday-foundry-hero-wordless.webp
          test -f assets/saturday-foundry-mobile-wordless.webp
          test -f assets/icons-premium/dynasties@1x.webp
          rm saturday-foundry-assets-install.zip

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets saturday-foundry-assets-install.zip
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Install Saturday Foundry assets"
          git push origin HEAD:saturday-foundry-test
