name: Install Saturday Foundry test build

on:
  push:
    branches: [saturday-foundry-test]
    paths:
      - '.sf-deploy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturday-foundry-test
      - name: Rebuild deployment package
        run: |
          cat .sf-deploy/part-*.b64 | base64 -d > /tmp/saturday-foundry.zip
          rm -rf assets index.html _headers
          unzip -o /tmp/saturday-foundry.zip -d .
          rm -rf .sf-deploy
      - name: Commit deployed build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install Saturday Foundry test build"
            git push origin HEAD:saturday-foundry-test
          fi
