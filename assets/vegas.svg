<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="gold" x1="18" y1="16" x2="111" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1A8"/>
      <stop offset=".42" stop-color="#F4C542"/>
      <stop offset="1" stop-color="#A86F16"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="45" y1="34" x2="107" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCE78A"/>
      <stop offset=".5" stop-color="#DDAE2F"/>
      <stop offset="1" stop-color="#8B5B12"/>
    </linearGradient>
    <linearGradient id="blackFace" x1="19" y1="25" x2="82" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17232A"/>
      <stop offset="1" stop-color="#05090B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".72"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <!-- back die -->
    <g transform="rotate(-10 50 56)">
      <rect x="17" y="22" width="67" height="67" rx="13" fill="url(#blackFace)" stroke="url(#gold)" stroke-width="5"/>
      <circle cx="34" cy="39" r="5" fill="url(#gold)"/>
      <circle cx="67" cy="39" r="5" fill="url(#gold)"/>
      <circle cx="50.5" cy="55.5" r="5" fill="url(#gold)"/>
      <circle cx="34" cy="72" r="5" fill="url(#gold)"/>
      <circle cx="67" cy="72" r="5" fill="url(#gold)"/>
    </g>
    <!-- front die -->
    <g transform="rotate(9 79 77)">
      <rect x="48" y="45" width="64" height="64" rx="13" fill="url(#goldFace)" stroke="#FFF1A8" stroke-width="4"/>
      <circle cx="65" cy="62" r="5" fill="#071116"/>
      <circle cx="95" cy="62" r="5" fill="#071116"/>
      <circle cx="65" cy="92" r="5" fill="#071116"/>
      <circle cx="95" cy="92" r="5" fill="#071116"/>
    </g>
  </g>
</svg>
